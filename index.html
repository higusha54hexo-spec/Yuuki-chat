<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudChat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0e1621;color:#fff}
button,input{font:inherit}
button{border:0;cursor:pointer}
.app{height:100%;display:flex;overflow:hidden}
.sidebar{width:360px;background:#17212b;border-right:1px solid #263746;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;padding:10px 14px;gap:12px}
.logo{font-size:22px;font-weight:700;flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;background:transparent;color:#aebbc7;font-size:22px}
.iconbtn:hover{background:#223242}
.search{padding:0 12px 10px}
.search input{width:100%;height:40px;border:0;outline:0;border-radius:9px;background:#242f3a;color:#fff;padding:0 14px}
.chatlist{overflow:auto;flex:1}
.chat{height:72px;padding:10px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.chat:hover,.chat.active{background:#202f3d}
.avatar{width:50px;height:50px;border-radius:50%;background:#3389c9;display:grid;place-items:center;font-weight:bold;font-size:18px;flex:none}
.chatbody{min-width:0;flex:1}
.chatline{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:#83919e}
.preview{font-size:14px;color:#8e9aa5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.main{flex:1;display:flex;flex-direction:column;background:#0e1621;min-width:0}
.empty{margin:auto;text-align:center;color:#7c8b98}
.header{height:64px;background:#17212b;display:flex;align-items:center;padding:8px 18px;gap:12px}
.header .status{font-size:13px;color:#81909d;margin-top:3px}
.messages{flex:1;overflow:auto;padding:20px 8%;display:flex;flex-direction:column;gap:6px}
.msg{max-width:65%;padding:8px 11px;border-radius:10px;background:#182533;align-self:flex-start;box-shadow:0 1px 1px #0003}
.msg.mine{align-self:flex-end;background:#2b5278}
.msgtext{white-space:pre-wrap;word-break:break-word}
.msgtime{font-size:11px;color:#a8b6c2;text-align:right;margin-top:4px}
.composer{padding:10px 18px;background:#17212b;display:flex;gap:10px}
.composer input{flex:1;min-width:0;background:#242f3a;color:#fff;border:0;outline:0;border-radius:10px;padding:12px 15px}
.send{width:46px;height:46px;border-radius:50%;background:#3390ec;color:#fff;font-size:20px}
.login{width:100%;height:100%;display:grid;place-items:center;background:#0e1621}
.card{width:min(400px,90%);background:#17212b;border-radius:14px;padding:30px}
.card h1{margin:0 0 8px}
.card p{color:#8493a0}
.card input{width:100%;margin:7px 0;padding:13px;border:0;border-radius:8px;background:#242f3a;color:#fff;outline:0}
.card button{width:100%;margin-top:10px;padding:13px;border-radius:8px;background:#3390ec;color:#fff;font-weight:bold}
.link{background:none!important;color:#4da3f5!important}
@media(max-width:700px){
.sidebar{width:100%}
.main{display:none}
.app.chat-open .sidebar{display:none}
.app.chat-open .main{display:flex}
.messages{padding:15px 4%}
.msg{max-width:82%}
}
</style>
</head>
<body>

<div id="root"></div>

<script>
const API = "/api";

let token = localStorage.getItem("token");
let me = null;
let currentChat = null;
let poll = null;

const $ = s => document.querySelector(s);

async function api(path, options = {}) {
  const headers = {"Content-Type":"application/json",...(options.headers||{})};
  if(token) headers.Authorization = "Bearer " + token;

  const r = await fetch(API + path,{...options,headers});
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || "Request failed");
  return data;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,x=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[x]));
}

function loginScreen(){
  document.body.innerHTML = `
  <div class="login">
    <div class="card">
      <h1>CloudChat</h1>
      <p>Telegram-style messenger</p>
      <input id="username" placeholder="Username">
      <input id="password" type="password" placeholder="Password">
      <button onclick="login()">Войти</button>
      <button class="link" onclick="register()">Создать аккаунт</button>
      <div id="error"></div>
    </div>
  </div>`;
}

async function login(){
  try{
    const username=$("#username").value.trim();
    const password=$("#password").value;
    const r=await api("/login",{
      method:"POST",
      body:JSON.stringify({username,password})
    });
    token=r.token;
    localStorage.setItem("token",token);
    await start();
  }catch(e){$("#error").textContent=e.message}
}

async function register(){
  try{
    const username=$("#username").value.trim();
    const password=$("#password").value;
    const r=await api("/register",{
      method:"POST",
      body:JSON.stringify({username,password})
    });
    token=r.token;
    localStorage.setItem("token",token);
    await start();
  }catch(e){$("#error").textContent=e.message}
}

async function start(){
  try{
    me=await api("/me");
    renderApp();
    await loadChats();
  }catch(e){
    localStorage.removeItem("token");
    token=null;
    loginScreen();
  }
}

function renderApp(){
 document.body.innerHTML=`
 <div class="app" id="app">
   <aside class="sidebar">
     <div class="top">
       <div class="logo">CloudChat</div>
       <button class="iconbtn" onclick="logout()">⋮</button>
     </div>
     <div class="search">
       <input id="search" placeholder="Поиск">
     </div>
     <div id="chatlist" class="chatlist"></div>
   </aside>

   <main class="main">
     <div id="empty" class="empty">
       <h2>CloudChat</h2>
       <div>Выберите чат</div>
     </div>

     <div id="chatui" style="display:none;height:100%;flex-direction:column">
       <header class="header">
         <button class="iconbtn" onclick="closeChat()">‹</button>
         <div>
           <div id="chatname" class="name"></div>
           <div id="status" class="status"></div>
         </div>
       </header>

       <div id="messages" class="messages"></div>

       <form class="composer" onsubmit="sendMessage(event)">
         <input id="message" autocomplete="off" placeholder="Сообщение">
         <button class="send">➤</button>
       </form>
     </div>
   </main>
 </div>`;
}

async function loadChats(){
  const chats=await api("/chats");
  const list=$("#chatlist");

  list.innerHTML=chats.map(c=>`
    <div class="chat" onclick="openChat('${c.id}')">
      <div class="avatar">${escapeHtml((c.name||"?")[0].toUpperCase())}</div>
      <div class="chatbody">
        <div class="chatline">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="time">${c.time||""}</div>
        </div>
        <div class="preview">${escapeHtml(c.lastMessage||"Нет сообщений")}</div>
      </div>
    </div>
  `).join("");
}

async function openChat(id){
  currentChat=id;
  $("#empty").style.display="none";
  $("#chatui").style.display="flex";
  document.querySelector(".app").classList.add("chat-open");

  const chat=await api("/chats/"+id);
  $("#chatname").textContent=chat.name;
  $("#status").textContent=chat.type==="private" ? "online" : "group";

  await loadMessages();

  clearInterval(poll);
  poll=setInterval(loadMessages,2500);
}

async function loadMessages(){
  if(!currentChat)return;

  const messages=await api("/chats/"+currentChat+"/messages");

  $("#messages").innerHTML=messages.map(m=>`
    <div class="msg ${m.userId===me.id?"mine":""}">
      <div class="msgtext">${escapeHtml(m.text)}</div>
      <div class="msgtime">
        ${escapeHtml(m.username)} · ${new Date(m.createdAt).toLocaleTimeString([],{
          hour:"2-digit",minute:"2-digit"
        })}
      </div>
    </div>
  `).join("");

  const box=$("#messages");
  box.scrollTop=box.scrollHeight;
}

async function sendMessage(e){
  e.preventDefault();

  const input=$("#message");
  const text=input.value.trim();
  if(!text || !currentChat)return;

  input.value="";

  try{
    await api("/chats/"+currentChat+"/messages",{
      method:"POST",
      body:JSON.stringify({text})
    });
    await loadMessages();
    await loadChats();
  }catch(e){
    alert(e.message);
  }
}

function closeChat(){
  currentChat=null;
  clearInterval(poll);
  document.querySelector(".app").classList.remove("chat-open");
}

function logout(){
  localStorage.removeItem("token");
  token=null;
  location.reload();
}

if(token) start();
else loginScreen();
</script>
</body>
</html>

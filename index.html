<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Настройки — CloudChat</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#0e1621;color:#fff}body{display:flex;justify-content:center}.settings{width:100%;max-width:720px;min-height:100vh;background:#17212b}.header{height:64px;display:flex;align-items:center;gap:15px;padding:0 18px;border-bottom:1px solid #263746}.back{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:28px;cursor:pointer}.back:hover{background:#243442}.title{font-size:21px;font-weight:600}.profile{padding:25px 20px;display:flex;align-items:center;gap:18px;border-bottom:8px solid #0e1621}.avatar{width:72px;height:72px;border-radius:50%;background:#3390ec center/cover;display:grid;place-items:center;font-size:28px;font-weight:bold;overflow:hidden}.profile-name{font-size:21px;font-weight:600}.profile-username{margin-top:7px;color:#8b9aa8}.section{padding:14px 0;border-bottom:8px solid #0e1621}.section-title{padding:0 20px 9px;color:#5da8e8;font-size:14px;text-transform:uppercase}.item{min-height:58px;padding:10px 20px;display:flex;align-items:center;gap:15px;cursor:pointer}.item:hover{background:#202f3d}.item-icon{width:32px;text-align:center;font-size:22px}.item-content{flex:1}.item-title{font-size:16px}.item-description{margin-top:4px;color:#82909d;font-size:13px}input[type=text]{width:100%;margin-top:8px;padding:11px;border:0;outline:0;border-radius:7px;background:#242f3a;color:#fff}.button{display:inline-block;margin-top:9px;padding:10px 14px;border:0;border-radius:8px;background:#3390ec;color:#fff;cursor:pointer}.file{display:none}.preview{width:100%;height:150px;border-radius:10px;margin-top:10px;background:#0e1621 center/cover no-repeat;display:grid;place-items:center;color:#71808d;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.remove{background:#3a2630;color:#ff7777;margin-left:7px}.status{padding:12px 20px;color:#6fb3e9;font-size:13px}.logout{color:#ff5c5c}
</style></head>
<body><div class="settings">
<div class="header"><button class="back" onclick="location.href='/'">‹</button><div class="title">Настройки</div></div>
<div class="profile"><div class="avatar" id="avatar">?</div><div><div class="profile-name" id="profileName">Загрузка...</div><div class="profile-username" id="profileUsername">@...</div></div></div>
<div class="section"><div class="section-title">Профиль</div>
<div class="item"><div class="item-icon">👤</div><div class="item-content"><div class="item-title">Аватар</div><div class="item-description">Своя картинка профиля</div><label class="button" for="avatarFile">Выбрать изображение</label><input id="avatarFile" class="file" type="file" accept="image/png,image/jpeg,image/webp"><button class="button remove" onclick="removeAvatar()">Удалить</button></div></div>
<div class="item"><div class="item-icon">🖼️</div><div class="item-content"><div class="item-title">Фон чатов</div><div class="item-description">Своя картинка вместо стандартного фона</div><label class="button" for="bgFile">Выбрать изображение</label><input id="bgFile" class="file" type="file" accept="image/png,image/jpeg,image/webp"><button class="button remove" onclick="removeBackground()">Сбросить</button><div id="bgPreview" class="preview">Предпросмотр фона</div></div></div>
</div>
<div id="status" class="status"></div>
</div>
<script>
const API='/api',token=localStorage.getItem('token');
async function api(path,options={}){if(!token){location.href='/';return}const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function imageData(file,max){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height,s=Math.min(1,max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);ok(c.toDataURL('image/jpeg',.8))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function avatar(){const e=document.getElementById('avatar'),v=localStorage.getItem('customAvatar');if(v){e.style.backgroundImage=`url("${v}")`;e.textContent=''}else{e.style.backgroundImage='';e.textContent=(document.getElementById('profileName').textContent||'?')[0].toUpperCase()}}
function bg(){const v=localStorage.getItem('customBackground'),p=document.getElementById('bgPreview');if(v)p.innerHTML=`<img src="${v}" alt="">`;else p.textContent='Предпросмотр фона'}
document.getElementById('avatarFile').onchange=async e=>{if(!e.target.files[0])return;localStorage.setItem('customAvatar',await imageData(e.target.files[0],512));avatar();show('Аватар сохранён')};
document.getElementById('bgFile').onchange=async e=>{if(!e.target.files[0])return;localStorage.setItem('customBackground',await imageData(e.target.files[0],1920));bg();show('Фон сохранён')};
function removeAvatar(){localStorage.removeItem('customAvatar');avatar();show('Аватар сброшен')}function removeBackground(){localStorage.removeItem('customBackground');bg();show('Фон сброшен')}function show(x){document.getElementById('status').textContent=x;setTimeout(()=>document.getElementById('status').textContent='',2500)}
(async()=>{try{const u=await api('/me');document.getElementById('profileName').textContent=u.username;document.getElementById('profileUsername').textContent='@'+u.username;avatar();bg()}catch(e){localStorage.removeItem('token');location.href='/'}})();
</script></body></html>
